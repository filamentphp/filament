daemon off;
pid /tmp/filament-demo-nginx.pid;
error_log stderr;

events {}

http {
    access_log off;
    client_body_temp_path /tmp/filament-demo-client-body;
    proxy_temp_path /tmp/filament-demo-proxy;
    fastcgi_temp_path /tmp/filament-demo-fastcgi;
    scgi_temp_path /tmp/filament-demo-scgi;
    uwsgi_temp_path /tmp/filament-demo-uwsgi;
    client_max_body_size 100m;

    map $http_x_forwarded_proto $forwarded_proto {
        default $http_x_forwarded_proto;
        "" $scheme;
    }

    server {
        listen __PORT__;

        location = /__orb/health {
            return 200;
        }

        location /app/ {
            proxy_pass http://127.0.0.1:6001;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $http_host;
            proxy_read_timeout 120s;
        }

        location / {
            proxy_pass http://127.0.0.1:8000;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
