services:
  demo:
    command: >-
      php artisan optimize:clear &&
      APP_ENV=production APP_URL="$PUBLIC_URL" ASSET_URL="$PUBLIC_URL" DEBUGBAR_ENABLED=false
      php artisan serve --host=0.0.0.0 --port="$PORT"
    cwd: ../repos/demo
    health: /login
    portal:
      url: /login
      title: Filament demo
      description: Sign in with admin@filamentphp.com and password "demo.Filament@2021!".
    agent: control
