name: filament-issue

on:
  # push:
  #   tags: '*'
  workflow_dispatch:
    inputs:
      version_label:
        description: 'Version label for the artifact (e.g. v4.0.5)'
        required: true

jobs:
  build-filament-issue:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ github.token }}

      - name: Resolve version label
        id: version
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            label="${GITHUB_REF_NAME}"
          else
            label="${{ github.event.inputs.version_label }}"
          fi
          echo "label=${label}" >> "$GITHUB_OUTPUT"

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: intl, sqlite3, pdo_sqlite, mbstring, zip
          coverage: none
          tools: composer:v2

      - name: Get current time
        id: current-time
        run: echo "time=$(date -u +'%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_OUTPUT

      - name: Build Filament Issue app
        run: ./bin/filament-issue.sh "${{ steps.version.outputs.label }}"

      - name: Upload zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: filament-issue-${{ steps.version.outputs.label }}
          path: filament-issue/filament-issue-${{ steps.version.outputs.label }}.zip
          retention-days: 90

      - name: Attach zip to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.label }}
          body: |
            Filament Issue reproduction app for `${{ steps.version.outputs.label }}`.

            Last generated on ${{ steps.current-time.outputs.time }}
          files: |
            filament-issue/filament-issue-${{ steps.version.outputs.label }}.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ github.token }}
